<!doctype html><html><head><meta charset="utf-8"><title>Spacing · 8pt grid</title><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="label">Spacing · 8pt base unit · all gaps are 8·n</div>
  <div style="display:grid;grid-template-columns:60px 1fr 70px;gap:10px 16px;align-items:center;font-family:'Montserrat',sans-serif;color:#8A8A8A;font-size:11px;letter-spacing:0.18em">
    <div>X · 8</div>
    <div><div style="width:8px;height:8px;background:#D4AF37"></div></div>
    <div style="text-align:right;color:#F5F5F5">--x</div>
    <div>2X · 16</div>
    <div><div style="width:16px;height:8px;background:#D4AF37"></div></div>
    <div style="text-align:right;color:#F5F5F5">--x-2</div>
    <div>3X · 24</div>
    <div><div style="width:24px;height:8px;background:#D4AF37"></div></div>
    <div style="text-align:right;color:#F5F5F5">--x-3</div>
    <div>4X · 32</div>
    <div><div style="width:32px;height:8px;background:#D4AF37"></div></div>
    <div style="text-align:right;color:#F5F5F5">--x-4</div>
    <div>6X · 48</div>
    <div><div style="width:48px;height:8px;background:#D4AF37"></div></div>
    <div style="text-align:right;color:#F5F5F5">--x-6</div>
    <div>8X · 64</div>
    <div><div style="width:64px;height:8px;background:#D4AF37"></div></div>
    <div style="text-align:right;color:#F5F5F5">--x-8</div>
    <div>12X · 96</div>
    <div><div style="width:96px;height:8px;background:#D4AF37"></div></div>
    <div style="text-align:right;color:#F5F5F5">--x-12</div>
  </div>
</div>
</body></html>
