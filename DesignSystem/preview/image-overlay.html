<!doctype html><html><head><meta charset="utf-8"><title>Image overlay</title><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="label">Imagery · always B&amp;W · 70–80% black mask before type</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
    <div style="position:relative;height:160px;background:linear-gradient(135deg,#2a2a2a,#0a0a0a 60%,#141414);overflow:hidden">
      <div style="position:absolute;left:14px;top:12px;font-family:Montserrat;font-size:10px;letter-spacing:0.2em;color:#bbb">RAW PHOTO · B&amp;W</div>
      <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 60% 30%,rgba(230,230,230,0.45),transparent 55%)"></div>
    </div>
    <div style="position:relative;height:160px;background:linear-gradient(135deg,#2a2a2a,#0a0a0a 60%,#141414);overflow:hidden">
      <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 60% 30%,rgba(230,230,230,0.45),transparent 55%)"></div>
      <div style="position:absolute;inset:0;background:rgba(20,20,20,0.78)"></div>
      <div style="position:absolute;left:14px;top:12px;font-family:Montserrat;font-size:10px;letter-spacing:0.2em;color:#D4AF37">WITH 78% MASK</div>
      <div style="position:absolute;left:14px;bottom:18px;right:14px;font-family:'Noto Sans TC',sans-serif;color:#F5F5F5;font-size:18px;letter-spacing:0.08em;line-height:1.5">沉浸與聚焦 — 一個隔絕干擾的視覺環境</div>
    </div>
  </div>
</div>
</body></html>
