<!doctype html><html><head><meta charset="utf-8"><title>Radii &amp; Shadows</title><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="label">Corners &amp; elevation · sharp, flat, zero shadow</div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <div style="width:90px;height:90px;background:#D4AF37"></div>
      <div style="font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:0.2em;color:#F5F5F5">DEFAULT · 0px</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <div style="width:90px;height:90px;background:#F5F5F5;border-radius:2px"></div>
      <div style="font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:0.2em;color:#F5F5F5">PORTRAITS · QR · 2px MAX</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <div style="width:90px;height:90px;background:#8A8A8A;border-radius:18px;position:relative">
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#141414;font-family:Montserrat;font-size:24px;font-weight:700">✕</div>
      </div>
      <div style="font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:0.2em;color:#8A8A8A">PILL · ROUNDED · OFF-BRAND</div>
    </div>
  </div>
  <div style="font-family:'Noto Sans TC',sans-serif;font-size:14px;color:#8A8A8A;line-height:1.6">無 box-shadow · 無 inner shadow · 深度來自對比，不來自模擬光線。</div>
</div>
</body></html>
