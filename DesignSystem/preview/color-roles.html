<!doctype html><html><head><meta charset="utf-8"><title>Color roles</title><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="label">Color roles · how each is used</div>
  <div style="display:grid;grid-template-columns:90px 1fr auto;gap:14px 18px;align-items:center;font-family:'Noto Sans TC',sans-serif;font-size:14px;line-height:1.5;">
    <div style="height:36px;background:#141414;border:1px solid #2a2a2a"></div>
    <div>背景主色　Page background, image overlay mask</div>
    <div style="font-family:Montserrat;font-size:11px;letter-spacing:0.2em;color:#8A8A8A">--bg</div>

    <div style="height:36px;background:#D4AF37"></div>
    <div>標題 / 亮點　Titles, hero number, dividers — the eye lands here</div>
    <div style="font-family:Montserrat;font-size:11px;letter-spacing:0.2em;color:#8A8A8A">--gold</div>

    <div style="height:36px;background:#F5F5F5"></div>
    <div>內文主色　Body, subtitles, captions of consequence</div>
    <div style="font-family:Montserrat;font-size:11px;letter-spacing:0.2em;color:#8A8A8A">--fg</div>

    <div style="height:36px;background:#8A8A8A"></div>
    <div>輔助 / 次級　Footnotes, axis labels, ghosted background art</div>
    <div style="font-family:Montserrat;font-size:11px;letter-spacing:0.2em;color:#8A8A8A">--muted</div>
  </div>
</div>
</body></html>
