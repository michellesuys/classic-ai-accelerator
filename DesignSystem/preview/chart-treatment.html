<!doctype html><html><head><meta charset="utf-8"><title>Chart treatment</title><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="label">Charts · gold for the one hero point · everything else grey</div>
  <div style="display:flex;align-items:flex-end;gap:18px;height:160px;padding:8px 4px 0;border-bottom:1px solid #3a3a3a">
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex:1">
      <div style="width:100%;height:30%;background:#8A8A8A"></div>
      <div style="font-family:Montserrat;font-size:11px;color:#8A8A8A;letter-spacing:0.14em">2022</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex:1">
      <div style="width:100%;height:42%;background:#8A8A8A"></div>
      <div style="font-family:Montserrat;font-size:11px;color:#8A8A8A;letter-spacing:0.14em">2023</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex:1">
      <div style="width:100%;height:55%;background:#8A8A8A"></div>
      <div style="font-family:Montserrat;font-size:11px;color:#8A8A8A;letter-spacing:0.14em">2024</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex:1">
      <div style="width:100%;height:74%;background:#8A8A8A"></div>
      <div style="font-family:Montserrat;font-size:11px;color:#8A8A8A;letter-spacing:0.14em">2025</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;position:relative">
      <div style="position:absolute;top:-26px;font-family:Montserrat;font-weight:700;font-size:18px;letter-spacing:0.12em;color:#D4AF37">+312%</div>
      <div style="width:100%;height:96%;background:#D4AF37"></div>
      <div style="font-family:Montserrat;font-size:11px;color:#D4AF37;letter-spacing:0.14em">2026</div>
    </div>
  </div>
</div>
</body></html>
