<!doctype html><html><head><meta charset="utf-8"><title>Iconography</title><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="label">Icons · line only · 1.5–2px stroke · gold or white</div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:16px;align-items:center;justify-items:center;padding:8px 0;">
    <!-- target -->
    <svg viewBox="0 0 32 32" width="40" height="40" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="16" r="12"/><circle cx="16" cy="16" r="7"/><circle cx="16" cy="16" r="2.5"/></svg>
    <!-- bolt -->
    <svg viewBox="0 0 32 32" width="40" height="40" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 3 L7 18 H15 L13 29 L25 13 H17 Z"/></svg>
    <!-- chart -->
    <svg viewBox="0 0 32 32" width="40" height="40" fill="none" stroke="#F5F5F5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 28 L4 4"/><path d="M4 28 L28 28"/><path d="M9 22 L9 18"/><path d="M15 22 L15 12"/><path d="M21 22 L21 16"/><path d="M27 22 L27 8"/></svg>
    <!-- arrow up-right -->
    <svg viewBox="0 0 32 32" width="40" height="40" fill="none" stroke="#F5F5F5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 24 L24 8"/><path d="M11 8 H24 V21"/></svg>
    <!-- shield -->
    <svg viewBox="0 0 32 32" width="40" height="40" fill="none" stroke="#F5F5F5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4 L26 8 V17 C26 23 21 28 16 29 C11 28 6 23 6 17 V8 Z"/></svg>
    <!-- node graph -->
    <svg viewBox="0 0 32 32" width="40" height="40" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="16" r="3"/><circle cx="26" cy="6" r="3"/><circle cx="26" cy="26" r="3"/><path d="M8.5 14.5 L23.5 7.5"/><path d="M8.5 17.5 L23.5 24.5"/></svg>
    <!-- diamond -->
    <svg viewBox="0 0 32 32" width="40" height="40" fill="none" stroke="#F5F5F5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4 L28 16 L16 28 L4 16 Z"/></svg>
  </div>
  <div style="font-family:Montserrat;font-size:10px;letter-spacing:0.22em;color:#8A8A8A">DEFAULT SET · LUCIDE (substituted) · NO EMOJI · NO FILLED ICONS</div>
</div>
</body></html>
