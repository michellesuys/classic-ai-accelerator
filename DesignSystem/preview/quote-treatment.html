<!doctype html><html><head><meta charset="utf-8"><title>Quote treatment</title><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="label">Quote · giant ghost mark · italic body · cited right</div>
  <div style="position:relative;height:200px;padding:0 24px;display:flex;flex-direction:column;justify-content:center;gap:18px">
    <div style="position:absolute;left:8px;top:-18px;font-family:Georgia,serif;color:#8A8A8A;opacity:0.2;font-size:220px;line-height:0.8">“</div>
    <div style="font-family:'Noto Sans TC',sans-serif;font-style:italic;font-size:24px;letter-spacing:0.1em;color:#F5F5F5;line-height:1.55;position:relative;z-index:1">秩序感來自於看不見的規則。</div>
    <div style="text-align:right;font-family:'Noto Sans TC',sans-serif;font-weight:300;font-size:13px;letter-spacing:0.16em;color:#8A8A8A;position:relative;z-index:1">— 設計風格索引 · Part 3.1</div>
  </div>
</div>
</body></html>
