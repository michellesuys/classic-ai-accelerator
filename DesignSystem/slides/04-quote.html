<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<title>Quote · 金句引言</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center}
  .stage{display:flex;align-items:center;justify-content:center;}
  .ghost{position:absolute;font-family:Georgia,'Noto Serif TC',serif;font-size:1400px;line-height:0.7;color:var(--muted);opacity:0.18;top:-18%;left:50%;transform:translateX(-50%);user-select:none}
  .frame{position:relative;z-index:1;max-width:1280px;padding:0 8%;display:flex;flex-direction:column;align-items:center;gap:64px}
  .quote{font-family:'Noto Sans TC',sans-serif;font-style:italic;font-weight:400;font-size:64px;letter-spacing:0.10em;color:var(--fg);line-height:1.55;text-align:center;margin:0;text-wrap:balance}
  .cite{align-self:flex-end;display:flex;align-items:center;gap:18px;font-family:'Noto Sans TC',sans-serif;font-weight:300;font-size:22px;letter-spacing:0.18em;color:var(--muted)}
  .cite::before{content:'';width:42px;height:1px;background:var(--gold)}
  .corner{position:absolute;right:5%;bottom:5%;display:flex;align-items:center;gap:10px;font-family:'Noto Sans TC',sans-serif;font-size:14px;letter-spacing:0.18em;color:var(--muted)}
  .corner::before{content:'';width:6px;height:6px;background:var(--gold)}
  .pgnum{position:absolute;left:5%;bottom:5%;font-family:'Montserrat',sans-serif;font-size:13px;letter-spacing:0.22em;color:var(--muted)}
</style></head>
<body>
<section class="stage" data-screen-label="04 Quote">
  <div class="ghost">“</div>
  <div class="frame">
    <p class="quote">秩序感來自於看不見的規則 — 在留白裡，每一個決定都成為宣言。</p>
    <div class="cite">設計風格索引 · Part 3.1</div>
  </div>
  <div class="pgnum">08 / 24</div>
  <div class="corner">決勝！未來商務</div>
</section>
</body></html>
