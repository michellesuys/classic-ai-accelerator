<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<title>Big Number</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center}
  .stage{display:flex;align-items:center;justify-content:center}
  .wrap{display:flex;flex-direction:column;align-items:center;gap:48px;text-align:center}
  .eyebrow{font-family:'Montserrat',sans-serif;font-weight:400;font-size:18px;letter-spacing:0.4em;color:var(--gold);display:flex;align-items:center;gap:16px}
  .eyebrow::before,.eyebrow::after{content:'';width:48px;height:1px;background:var(--gold)}
  .big{font-family:'Montserrat',sans-serif;font-weight:700;font-size:520px;line-height:0.85;letter-spacing:-0.04em;color:var(--gold);margin:0}
  .big sup{font-size:160px;font-weight:300;letter-spacing:0;color:var(--fg);vertical-align:super;margin-left:8px}
  .cap{font-family:'Noto Sans TC',sans-serif;font-weight:500;font-size:36px;letter-spacing:0.16em;color:var(--fg);max-width:1100px;line-height:1.5}
  .source{font-family:'Noto Sans TC',sans-serif;font-weight:300;font-size:15px;letter-spacing:0.18em;color:var(--muted)}
  .corner{position:absolute;right:5%;bottom:5%;display:flex;align-items:center;gap:10px;font-family:'Noto Sans TC',sans-serif;font-size:14px;letter-spacing:0.18em;color:var(--muted)}
  .corner::before{content:'';width:6px;height:6px;background:var(--gold)}
  .pgnum{position:absolute;left:5%;bottom:5%;font-family:'Montserrat',sans-serif;font-size:13px;letter-spacing:0.22em;color:var(--muted)}
</style></head>
<body>
<section class="stage" data-screen-label="07 Big Number">
  <div class="wrap">
    <div class="eyebrow">THE FIGURE THAT MATTERS</div>
    <div class="big">312<sup>%</sup></div>
    <div class="cap">具備 AI 戰略部署的企業，在五年內的營收成長中位數。</div>
    <div class="source">資料來源 · 經典企業 AI 加速器 · 2026 Q1 研究報告</div>
  </div>
  <div class="pgnum">15 / 24</div>
  <div class="corner">決勝！未來商務</div>
</section>
</body></html>
