<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<title>Speaker · 講者介紹</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center}
  .stage{display:grid;grid-template-columns:40% 60%;}
  .portrait{position:relative;height:100%;background:#0a0a0a;overflow:hidden}
  .portrait img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.15)}
  .portrait::after{content:'';position:absolute;inset:0;background:linear-gradient(to right,transparent 75%,rgba(20,20,20,0.55))}
  .right{display:flex;flex-direction:column;justify-content:center;padding:0 12% 0 8%;gap:32px;position:relative}
  .tag{font-family:'Montserrat',sans-serif;font-size:16px;letter-spacing:0.4em;color:var(--gold);display:flex;align-items:center;gap:16px}
  .tag::before{content:'';width:48px;height:1px;background:var(--gold)}
  .name-zh{font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:88px;letter-spacing:0.14em;color:var(--gold);line-height:1.05;margin:0}
  .name-en{font-family:'Montserrat',sans-serif;font-weight:300;font-size:28px;letter-spacing:0.32em;color:var(--fg);margin-top:-8px}
  .rule{width:96px;height:1px;background:var(--gold)}
  .role{font-family:'Noto Sans TC',sans-serif;font-weight:500;font-size:28px;letter-spacing:0.12em;color:var(--fg);line-height:1.55}
  .bio{font-family:'Noto Sans TC',sans-serif;font-weight:300;font-size:22px;letter-spacing:0.06em;color:var(--muted);line-height:1.85;max-width:680px}
  .corner{position:absolute;right:5%;bottom:5%;display:flex;align-items:center;gap:10px;font-family:'Noto Sans TC',sans-serif;font-size:14px;letter-spacing:0.18em;color:var(--muted)}
  .corner::before{content:'';width:6px;height:6px;background:var(--gold)}
</style></head>
<body>
<section class="stage" data-screen-label="03 Speaker">
  <div class="portrait">
    <img src="../assets/portrait-placeholder.svg" alt="speaker portrait">
  </div>
  <div class="right">
    <div class="tag">KEYNOTE SPEAKER</div>
    <h1 class="name-zh">張育成</h1>
    <div class="name-en">YU-CHENG CHANG</div>
    <div class="rule"></div>
    <div class="role">經典企業 AI 加速器 · 首席策略顧問</div>
    <p class="bio">深耕企業 AI 導入十年，協助 80+ 家上市公司完成商業模式重構。<br>研究領域涵蓋大型語言模型治理、決策自動化、組織演化。</p>
  </div>
  <div class="corner">決勝！未來商務</div>
</section>
</body></html>
