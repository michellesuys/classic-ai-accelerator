<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<title>Cover · 決勝！未來商務</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .stage{display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .chapter-tag{
    font-family:'Montserrat',sans-serif;font-weight:400;font-size:18px;letter-spacing:0.4em;
    color:var(--muted);margin-bottom:64px;display:flex;align-items:center;gap:14px;
  }
  .chapter-tag::before,.chapter-tag::after{content:'';width:48px;height:1px;background:var(--gold);}
  .title-zh{font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:128px;letter-spacing:0.16em;color:var(--gold);line-height:1.05;margin:0;text-align:center;}
  .title-zh .bang{color:var(--fg);}
  .title-en{font-family:'Montserrat',sans-serif;font-weight:300;font-size:22px;letter-spacing:0.42em;color:var(--fg);margin-top:48px;}
  .meta{
    position:absolute;left:5%;bottom:5%;display:flex;flex-direction:column;gap:6px;
    font-family:'Montserrat',sans-serif;font-size:13px;letter-spacing:0.22em;color:var(--muted);
  }
  .meta .gold-line{width:42px;height:1px;background:var(--gold);margin-bottom:10px}
  .corner{position:absolute;right:5%;bottom:5%;display:flex;align-items:center;gap:10px;font-family:'Noto Sans TC',sans-serif;font-size:14px;letter-spacing:0.18em;color:var(--muted);white-space:nowrap}
  .corner::before{content:'';width:6px;height:6px;background:var(--gold);}
</style></head>
<body>
<section class="stage" data-screen-label="01 Cover">
  <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;">
    <div class="chapter-tag">KEYNOTE · 2026</div>
    <h1 class="title-zh">決勝<span class="bang">！</span>未來商務</h1>
    <div class="title-en">DECISIVE · FUTURE · BUSINESS</div>
  </div>
  <div class="meta">
    <div class="gold-line"></div>
    <div>2026 / 06 / 12</div>
    <div>TAIPEI · GRAND HYATT</div>
  </div>
  <div class="corner">經典企業 AI 加速器</div>
</section>
</body></html>
