<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<title>Content · 三大核心理念</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center}
  .stage{padding:8% 7% 7%;display:flex;flex-direction:column;gap:64px}
  .eyebrow{font-family:'Montserrat',sans-serif;font-weight:400;font-size:18px;letter-spacing:0.4em;color:var(--gold);display:flex;align-items:center;gap:16px}
  .eyebrow::before{content:'';width:48px;height:1px;background:var(--gold)}
  .h2{font-family:'Noto Sans TC',sans-serif;font-weight:500;font-size:64px;letter-spacing:0.12em;color:var(--fg);margin:0;line-height:1.25;max-width:1280px}
  .h2 .gold{color:var(--gold);font-weight:700}
  .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:64px;margin-top:8px}
  .col{display:flex;flex-direction:column;gap:24px}
  .col .rule{width:64px;height:1px;background:var(--gold)}
  .col .nm{font-family:'Montserrat',sans-serif;font-size:14px;letter-spacing:0.32em;color:var(--gold)}
  .col h3{font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:38px;letter-spacing:0.14em;color:var(--fg);margin:0;line-height:1.2}
  .col p{font-family:'Noto Sans TC',sans-serif;font-weight:300;font-size:22px;letter-spacing:0.04em;color:var(--muted);line-height:1.85;margin:0}
  .corner{position:absolute;right:5%;bottom:5%;display:flex;align-items:center;gap:10px;font-family:'Noto Sans TC',sans-serif;font-size:14px;letter-spacing:0.18em;color:var(--muted)}
  .corner::before{content:'';width:6px;height:6px;background:var(--gold)}
  .pgnum{position:absolute;left:5%;bottom:5%;font-family:'Montserrat',sans-serif;font-size:13px;letter-spacing:0.22em;color:var(--muted)}
</style></head>
<body>
<section class="stage" data-screen-label="05 Three Principles">
  <div>
    <div class="eyebrow">DESIGN MANIFESTO</div>
    <div style="height:40px"></div>
    <h2 class="h2">三大<span class="gold">核心理念</span>，環繞同一個目的：<br>讓每一句話、每一個畫面都擁有重量。</h2>
  </div>

  <div class="cols">
    <div class="col">
      <div class="nm">01</div>
      <div class="rule"></div>
      <h3>沉浸與聚焦</h3>
      <p>深色背景與高對比元素，創造隔絕干擾的視覺環境，引導聽眾將注意力完全集中於內容與講者。</p>
    </div>
    <div class="col">
      <div class="nm">02</div>
      <div class="rule"></div>
      <h3>權威與價值</h3>
      <p>透過精緻的黑金配色與穩重版面，傳達內容的含金量、講者的專業性，以及為聽眾創造的非凡價值。</p>
    </div>
    <div class="col">
      <div class="nm">03</div>
      <div class="rule"></div>
      <h3>簡潔與力量</h3>
      <p>奉行「少即是多」原則。透過大量的留白，讓每一個文字、每一張圖表都充滿視覺力量。</p>
    </div>
  </div>
  <div class="pgnum">05 / 24</div>
  <div class="corner">決勝！未來商務</div>
</section>
</body></html>
